function sortPartner(key){if(pSortKey===key)pSortAsc=!pSortAsc;else{pSortKey=key;pSortAsc=true;}renderPartners();}
function renderStores(){
  var minC=parseInt(document.getElementById('sMinCount').value);
  var pf=document.getElementById('sPartnerFilter').value;
  var data=stores.filter(function(s){return s.count>=minC&&(!pf||s.partner===pf)});
  data.sort(function(a,b){return sSortAsc?(a[sSortKey]>b[sSortKey]?1:-1):(a[sSortKey]<b[sSortKey]?1:-1)});
  var tb=document.getElementById('storeBody');
  var html='';
  for(var i=0;i<data.length;i++){
    var s=data[i];
    html+='<tr><td>'+s.store+'</td><td>'+s.partner+'</td><td>'+s.count+'</td><td>'+s.avg+'</td><td>'+s.median+'</td></tr>';
  }
  tb.innerHTML=html;
}
function sortStore(key){if(sSortKey===key)sSortAsc=!sSortAsc;else{sSortKey=key;sSortAsc=true;}renderStores();}
var pu=[],seen={};
for(var i=0;i<stores.length;i++){if(!seen[stores[i].partner]){seen[stores[i].partner]=true;pu.push(stores[i].partner);}}
pu.sort();var sel=document.getElementById('sPartnerFilter');
for(var i=0;i<pu.length;i++){var o=document.createElement('option');o.value=pu[i];o.textContent=pu[i];sel.appendChild(o);}
renderPartners();renderStores();
</script></body></html>
